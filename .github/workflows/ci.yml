name: ci

# Tests only. This workflow never deploys, never applies migrations remotely and
# holds no secrets. Production scheduling belongs to Cloudflare, not GitHub.

on:
  push:
    branches: [boxing-core-v1, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BOXING_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:secrets
      - run: npm test

  web:
    # Boxing frontend: unit tests, typecheck and a production build with no
    # gateway configured (every page must still render its unavailable state).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      # posture static checks + next build + scan of client bundles and prerendered HTML for secrets
      - run: npm run build

  web-posture-live:
    # After a push to main, wait for Vercel to serve this commit on the production alias, then probe
    # it anonymously: robots, noindex meta + X-Robots-Tag, no custom-domain metadata, no secrets in
    # HTML or JS bundles, no write endpoints, gateway refuses anonymous. Anonymous 200 is allowed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for the alias to serve this commit
        run: |
          want="${GITHUB_SHA:0:12}"
          for i in $(seq 1 60); do
            got=$(curl -sI https://boxing-alpha-beryl.vercel.app/ | tr -d '' | awk -F': ' 'tolower($1)=="x-boxing-build"{print $2}')
            if [ "$got" = "$want" ]; then echo "serving $want"; exit 0; fi
            sleep 15
          done
          echo "alias still serving ${got:-unknown}; a newer push or a failed Vercel build (posture failures fail the build)"
          exit 1
      - run: node scripts/posture.mjs live https://boxing-alpha-beryl.vercel.app
