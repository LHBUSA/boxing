# boxing-rankings — title graph, ranking snapshots and sanctioning-body collection.
#
# Top-level (default) environment: NOT DEPLOYED, collection OFF, no cron.
# [env.production] -> Worker "boxing-rankings-production", writes ONLY to Supabase lobcdprmoiosbjanheeo
# (shared/store/target-guard.mjs). No routes, no workers.dev.
#   secrets (wrangler secret put ... --env production): SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, BOXING_INTERNAL_TOKEN
#
# Sources (owner approvals 2026-09-14): WBA /wba-ranking + /current-wba-champions, IBF ratings JSON (Crawl-delay 10),
# WBO ratings PDF (token from /rankings/ each run) + /male-champions/; (owner approval 2026-09-15) WBC public ratings
# page https://wbcboxing.com/ratings/ (champions grid + the linked men's ratings PDF, never a guessed file name).
# Cadence: monthly, as approved, one slot per body on the 20th (WBA 14:25Z, WBO 14:35Z, IBF 14:45Z, WBC 14:55Z; mapping in
# shared/adapters/rankings/registry.mjs BODY_BY_CRON); unchanged documents are duplicates and write nothing. A body that
# publishes after the 20th is picked up the following month. Historical backfill is an operator job
# (scripts/staging/titles-collect.ps1 -Backfill), throttled and checkpointed, never on this cron.

name = "boxing-rankings"
main = "src/index.mjs"
compatibility_date = "2026-09-01"
workers_dev = false

[triggers]
crons = []

[vars]
TITLES_INGEST_ENABLED = "false"

[observability]
enabled = true
head_sampling_rate = 1

[env.production]
name = "boxing-rankings-production"
workers_dev = false

[env.production.triggers]
crons = ["25 14 20 * *", "35 14 20 * *", "45 14 20 * *", "55 14 20 * *"]

# PDF text extraction (WBO, WBC) plus identity-candidate matching is CPU-heavy; the default 30 s budget is not enough
[env.production.limits]
cpu_ms = 300000

[env.production.version_metadata]
binding = "CF_VERSION_METADATA"

[env.production.vars]
BOXING_WORKER_NAME = "boxing-rankings-production"
BOXING_ENVIRONMENT = "production"
BOXING_SUPABASE_REF = "lobcdprmoiosbjanheeo"
TITLES_INGEST_ENABLED = "false"

[env.production.observability]
enabled = true
head_sampling_rate = 1
