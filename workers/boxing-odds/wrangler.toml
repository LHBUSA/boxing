# boxing-odds — scheduled boxing market capture. NOT DEPLOYED.
#
# Capture stays OFF until ALL of:
#   1. the_odds_api row in boxing_sources is reviewed (terms, plan, persistence,
#      display, derivative rights) and enabled — a database change, not config
#   2. ODDS_CAPTURE_ENABLED = "true" below
#   3. secrets: wrangler secret put SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY /
#      ODDS_API_KEY / BOXING_INTERNAL_TOKEN
#
# Cost: one bulk call per run = regions x markets credits (us x h2h = 1).
# 12 runs/day = ~360 credits/month. Never add a user-driven refresh.

name = "boxing-odds"
main = "src/index.mjs"
compatibility_date = "2026-09-01"
workers_dev = false

[triggers]
crons = ["15 */2 * * *"]

[vars]
ODDS_CAPTURE_ENABLED = "false"
ODDS_REGIONS = "us"
ODDS_MARKETS = "h2h"
ODDS_MIN_REMAINING = "5000"
ODDS_MAX_CALL_COST = "4"

[observability]
enabled = true
head_sampling_rate = 1
