# boxing-odds — scheduled boxing market capture.
#
# Top-level (default) environment: NOT DEPLOYED and capture OFF. The write-target
# allow-list in shared/store/target-guard.mjs holds only the one Boxing database.
#
# [env.production] -> Worker "boxing-odds-production", writes ONLY to Supabase
# lobcdprmoiosbjanheeo (propbetedge-boxing-production). No routes, no workers.dev.
#   secrets (wrangler secret put ... --env production):
#     SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, ODDS_API_KEY, BOXING_INTERNAL_TOKEN
#
# Capture gates (all must pass): ODDS_CAPTURE_ENABLED="true", verified write
# target, the_odds_api source row approved with a rights review (migration
# 0010), key present, plan cost <= ODDS_MAX_RUN_COST, adaptive cadence due,
# daily budget not exhausted, unmetered preflight >= ODDS_MIN_REMAINING.
#
# Cost: one call per region; credits = markets per region. Plan below = 6
# credits per capture. Cadence and quota math: docs/ODDS_CAPTURE.md.
# Never add a user-driven refresh.

name = "boxing-odds"
main = "src/index.mjs"
compatibility_date = "2026-09-01"
workers_dev = false

[triggers]
crons = []

[vars]
ODDS_CAPTURE_ENABLED = "false"
ODDS_REGION_PLAN = "us=h2h,totals;us2=h2h;uk=h2h;eu=h2h;au=h2h"
ODDS_MIN_REMAINING = "20000"
ODDS_MAX_RUN_COST = "8"
ODDS_MONTHLY_BUDGET = "8000"
ODDS_DAILY_BUDGET = "600"

[observability]
enabled = true
head_sampling_rate = 1

[env.production]
name = "boxing-odds-production"
workers_dev = false

[env.production.triggers]
crons = ["*/15 * * * *"]

[env.production.version_metadata]
binding = "CF_VERSION_METADATA"

[env.production.vars]
BOXING_WORKER_NAME = "boxing-odds-production"
BOXING_ENVIRONMENT = "production"
BOXING_SUPABASE_REF = "lobcdprmoiosbjanheeo"
ODDS_CAPTURE_ENABLED = "true"
ODDS_REGION_PLAN = "us=h2h,totals;us2=h2h;uk=h2h;eu=h2h;au=h2h"
ODDS_MIN_REMAINING = "20000"
ODDS_MAX_RUN_COST = "8"
ODDS_MONTHLY_BUDGET = "8000"
ODDS_DAILY_BUDGET = "600"

[env.production.observability]
enabled = true
head_sampling_rate = 1
