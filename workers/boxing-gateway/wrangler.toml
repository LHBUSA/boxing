# boxing-gateway — read-only internal API over Boxing Core.
# GET only, bearer-token protected, no cron, no collection, no writes.
#
# Top-level (default) environment: NOT DEPLOYED. The store is built only for the
# one Boxing database on the allow-list in shared/store/target-guard.mjs.
#
# [env.production] -> Worker "boxing-gateway-production" on workers.dev. Its only
# consumer is the Boxing frontend's SERVER (Next.js route handlers / server
# components on Vercel preview); the token never reaches a browser. /health is
# the only unauthenticated path.
#   secrets (scripts/staging/set-gateway-worker-secrets.ps1):
#     SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, BOXING_INTERNAL_TOKEN

name = "boxing-gateway"
main = "src/index.mjs"
compatibility_date = "2026-09-01"
workers_dev = false

[observability]
enabled = true
head_sampling_rate = 1

[env.production]
name = "boxing-gateway-production"
workers_dev = true

[env.production.vars]
BOXING_WORKER_NAME = "boxing-gateway-production"
BOXING_ENVIRONMENT = "production"
BOXING_SUPABASE_REF = "lobcdprmoiosbjanheeo"

[env.production.observability]
enabled = true
head_sampling_rate = 1
