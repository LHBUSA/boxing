# boxing-news — fact-driven Boxing Wire. NOT DEPLOYED.
# NEWSROOM_ENABLED gates generation; NEWS_AUTOPUBLISH_ENABLED separately gates
# publishing approved articles (both false). Sensitive and low-confidence
# items always wait for a named human reviewer regardless of these flags.
# Secrets at deploy: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, BOXING_INTERNAL_TOKEN.

name = "boxing-news"
main = "src/index.mjs"
compatibility_date = "2026-09-01"
workers_dev = false

[triggers]
crons = ["*/10 * * * *"]

[vars]
NEWSROOM_ENABLED = "false"
NEWS_AUTOPUBLISH_ENABLED = "false"

[observability]
enabled = true
head_sampling_rate = 1
