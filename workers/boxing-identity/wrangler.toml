# boxing-identity — internal canonical boxer identity service.
# NOT DEPLOYED. No routes, no workers.dev URL, no cron.
#
# Deploy only after: a boxing Supabase project exists, migrations are applied
# with owner approval, and secrets are set:
#   wrangler secret put SUPABASE_URL
#   wrangler secret put SUPABASE_SERVICE_ROLE_KEY
#   wrangler secret put BOXING_INTERNAL_TOKEN      (>= 32 chars)
# Other workers should reach it via a service binding, not a public route.

name = "boxing-identity"
main = "src/index.mjs"
compatibility_date = "2026-09-01"
workers_dev = false

[vars]
IDENTITY_SEED_ENABLED = "false"

[observability]
enabled = true
head_sampling_rate = 1
